services:
  db:
    image: postgres:16-alpine
    container_name: flowboard-db
    environment:
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
      POSTGRES_DB: flowboard
    ports:
      - '5432:5432'
    volumes:
      - flowboard_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowboard -d flowboard']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  flowboard_db:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard
          POSTGRES_DB: flowboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flowboard:flowboard@localhost:5432/flowboard?schema=public
      DIRECT_URL: postgresql://flowboard:flowboard@localhost:5432/flowboard?schema=public
      JWT_SECRET: ci-test-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --config prisma7.config.ts
      - run: pnpm exec prisma migrate deploy --config prisma7.config.ts
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
